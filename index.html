<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laboratorio Botánico 3D</title>
    <link rel="stylesheet" href="style.css">
    <!-- Import map para cargar Three.js localmente -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <!-- Panel de Información (Raycasting) -->
    <div id="info-panel" class="hidden">
        <h2 id="info-name">Nombre de la Parte</h2>
        <p><strong>Geometría:</strong> <span id="info-geometry">...</span></p>
        <p><strong>Altura:</strong> <span id="info-height">...</span></p>
        <p><strong>Función:</strong> <span id="info-desc">...</span></p>
    </div>

    <!-- Panel de Controles HTML -->
    <div id="controls-panel">
        <h3>Controles del Laboratorio</h3>
        <button id="btn-anim">Pausar Animación</button>
        <button id="btn-leaf-color">Cambiar Color de Hojas</button>
        <button id="btn-toggle-leaves">Ocultar Hojas</button>
        <button id="btn-camera">Reiniciar Cámara</button>
        
        <div class="slider-container">
            <label for="light-slider">Luz Principal:</label>
            <input type="range" id="light-slider" min="0" max="3" step="0.1" value="1.5">
        </div>
    </div>

    <!-- Script principal -->
    <script type="module" src="main.js"></script>
</body>
</html>
